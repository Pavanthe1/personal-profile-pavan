apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-profile-pavan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: personal-profile-pavan
  template:
    metadata:
      labels:
        app: personal-profile-pavan
    spec:
      containers:
      - name: personal-profile-pavan
        image: raghavendrasaladi/personal-profile-pavan:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: personal-profile-service-pavan
spec:
  type: NodePort
  selector:
    app: personal-profile-pavan
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30014
